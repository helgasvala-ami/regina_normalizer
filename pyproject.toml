[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regina-normalizer"
version = "0.1.0"
description = "A text normalization package for Icelandic"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = { text = "MIT" }
authors = [
  { name = "Helga Svala Sigurðardóttir, Anna Björk Nikulásdóttir", email = "helgasvala@hi.is" }
]
keywords = ["normalizer", "Icelandic", "text", "TTS"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent"
]
dependencies = [
  "icebert-pos[torch] @ git+https://github.com/mideind/IceBERT-PoS.git@v0.3.0",
  "transformers>=4.46.3,<6.0",
]

[project.scripts]
regina_normalizer = "regina_normalizer.normalizer:main"

[tool.setuptools]
packages = ["regina_normalizer"]
include-package-data = true

[tool.setuptools.package-data]
"regina_normalizer" = ["*.txt"]
